name: Data-independent regression tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  regressions:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Check dependencies
        run: python -m pip check
      - name: Check source syntax
        run: python -m compileall -q src tests reports run_all.py
      - name: Run regressions without private data
        run: python -m unittest discover -s tests -p test_regressions.py -v
